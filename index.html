    <script>
      (() => {
        const isPhone = window.matchMedia('(max-width: 767px)').matches;
        const mode = window.localStorage.getItem(isPhone ? 'phone-theme-mode' : 'desktop-theme-mode');
        const isDark = mode === 'dark';
        document.documentElement.classList.toggle('phone-dark', isDark);
        document.querySelector('meta[name="theme-color"]')
          ?.setAttribute('content', isDark ? '#242526' : '#e2e8f0');
      })();
    </script>

    <style>
      html,

      .app-loading-screen {

      .loading-orbit {

      .loading-orbit-dots {

        inset: 0;

        position: absolute;
        top: 50%;
        left: 50%;
        width: 5px;
        height: 5px;
        margin: -2.5px;

        background: #ef1c24;

        height: 38px;
        object-fit: contain;
        transform: translate(-50%, -50%);
      }

      @keyframes loading-orbit {
        to { transform: rotate(360deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        .loading-orbit-dots {
          animation-duration: 8s;
        }
      }
